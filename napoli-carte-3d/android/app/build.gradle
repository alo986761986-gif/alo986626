plugins { id 'com.android.application' }
android {
    namespace 'it.napolicarte.game'
    compileSdk 35
    defaultConfig {
        applicationId 'it.napolicarte.game'
        minSdk 21
        targetSdk 28
        versionCode 3
        versionName '1.3.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
