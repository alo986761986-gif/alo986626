services:
  - type: web
    name: trish-boll-global-arena
    runtime: node
    repo: https://github.com/alo986761986-gif/alo986626
    branch: trish-boll-v4-native-premium
    rootDir: trish-boll-server
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
