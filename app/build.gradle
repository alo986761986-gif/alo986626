plugins { id 'com.android.application'; id 'com.google.gms.google-services' version '4.4.2' }
android {
    namespace 'it.napolicarte.game'
    compileSdk 36
    defaultConfig {
        applicationId 'it.napolicarte.game'
        minSdk 24
        targetSdk 36
        versionCode 101
        versionName '9.11.0'
    }
    signingConfigs {
        release {
            if (System.getenv('UPLOAD_KEYSTORE')) {
                storeFile file(System.getenv('UPLOAD_KEYSTORE'))
                storePassword System.getenv('UPLOAD_STORE_PASSWORD')
                keyAlias System.getenv('UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('UPLOAD_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release { minifyEnabled false; if (System.getenv('UPLOAD_KEYSTORE')) signingConfig signingConfigs.release }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-auth:24.2.0'
    implementation 'com.google.firebase:firebase-messaging:25.0.1'
    implementation 'com.google.android.gms:play-services-auth:21.3.0'
    implementation 'com.android.billingclient:billing:8.0.0'
    implementation 'com.google.android.gms:play-services-ads:24.9.0'
    implementation 'com.google.android.ump:user-messaging-platform:3.2.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.webkit:webkit:1.10.0'
}


// Reproduce the generated 9.3 catalogue before every Android build.
tasks.register('prepareExpansionIndex', Exec) {
    workingDir rootProject.projectDir
    commandLine 'node', new File(rootProject.projectDir, 'tools/prepare-expansion-index.cjs').absolutePath
}
tasks.named('preBuild').configure { dependsOn 'prepareExpansionIndex' }
