name: FOUR SPORTS GAME 3.0 Ultra APK
on:
  push:
    branches: [four-sports-game-ultra-v3]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore standalone 3.0 game project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p four-sports-v3
          base64 -d fsg_v3_source.b64 | tar -xJ -C four-sports-v3
          ASSETS=four-sports-v3/android/app/src/main/assets
          for name in index.html engine.js engine3.js premium.js ultra.js game.js style.css premium.css ultra.css; do
            test -s "$ASSETS/$name"
          done
          test -s four-sports-v3/android/app/src/main/java/com/foursportsgame/arena/MainActivity.java
      - name: Build signed Android 5+ APK (javac, D8, AAPT2)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/four-sports-v3/android/app"
          OUT="$PWD/four-sports-v3-build"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p "$OUT/classes" "$OUT/dex" "$OUT/assets"
          javac -source 8 -target 8 -Xlint:-options -bootclasspath "$PLATFORM" -d "$OUT/classes" "$ROOT/src/main/java/com/foursportsgame/arena/MainActivity.java"
          "$BT/d8" --min-api 21 --lib "$PLATFORM" --output "$OUT/dex" "$OUT"/classes/com/foursportsgame/arena/*.class
          test -s "$OUT/dex/classes.dex"
          "$BT/aapt2" compile --dir "$ROOT/src/main/res" -o "$OUT/resources.zip"
          "$BT/aapt2" link -o "$OUT/unsigned.apk" -I "$PLATFORM" --manifest "$ROOT/src/main/AndroidManifest.xml" --min-sdk-version 21 --target-sdk-version 28 --version-code 4 --version-name 3.0.0 "$OUT/resources.zip"
          cp "$OUT/dex/classes.dex" "$OUT/"
          cp "$ROOT"/src/main/assets/* "$OUT/assets/"
          (cd "$OUT" && zip -0 -q unsigned.apk classes.dex && zip -0 -q unsigned.apk assets/*)
          "$BT/zipalign" -f 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          PASS="$(openssl rand -hex 12)"
          keytool -genkeypair -alias foursportsgame -keyalg RSA -keysize 3072 -validity 3650 -keystore "$OUT/fsg3.jks" -storepass "$PASS" -keypass "$PASS" -dname "CN=FOUR SPORTS GAME 3.0,O=Four Sports Game,C=IT" -noprompt
          "$BT/apksigner" sign --ks "$OUT/fsg3.jks" --ks-key-alias foursportsgame --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out "$OUT/FOUR_SPORTS_GAME_3_0_ULTRA_INSTALLABILE.apk" "$OUT/aligned.apk"
      - name: Verify signed APK and complete 3D assets
        shell: bash
        run: |
          set -euo pipefail
          APK=four-sports-v3-build/FOUR_SPORTS_GAME_3_0_ULTRA_INSTALLABILE.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          for a in classes.dex assets/index.html assets/engine3.js assets/ultra.js assets/ultra.css assets/game.js assets/premium.js; do
            unzip -l "$APK" | grep -F "$a"
          done
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E 'package:|launchable-activity:|sdkVersion:|targetSdkVersion:'
          sha256sum "$APK"
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUR_SPORTS_GAME_3_0_ULTRA_ANDROID_APK
          path: four-sports-v3-build/FOUR_SPORTS_GAME_3_0_ULTRA_INSTALLABILE.apk
          if-no-files-found: error
      - name: Publish APK for a direct installable download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp four-sports-v3-build/FOUR_SPORTS_GAME_3_0_ULTRA_INSTALLABILE.apk downloads/FOUR_SPORTS_GAME_3_0_ULTRA_INSTALLABILE.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/FOUR_SPORTS_GAME_3_0_ULTRA_INSTALLABILE.apk
          git commit -m "Publish signed installable FOUR SPORTS GAME 3.0 Ultra"
          git push origin HEAD:four-sports-game-ultra-v3
