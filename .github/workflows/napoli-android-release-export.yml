name: Napoli Carte 3D - release APK for private signing
on:
  push:
    branches:
      - fix/google-chat-realtime-20261127
    paths:
      - '.github/workflows/napoli-android-release-export.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export-unsigned-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK
        run: |
          echo "${ANDROID_HOME}/cmdline-tools/latest/bin" >> "${GITHUB_PATH}"
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"
      - name: Verify Firebase config and patched code
        run: |
          python3 - <<'PY'
          import json, pathlib
          cfg=json.loads(pathlib.Path('app/google-services.json').read_text())
          assert cfg['project_info']['project_id']=='napoli-carte-3d'
          app=pathlib.Path('app/build.gradle').read_text()
          assert "versionCode 102" in app and "versionName '9.12.0'" in app
          auth=pathlib.Path('app/src/main/java/it/napolicarte/game/AccountActivity.java').read_text()
          assert 'signingSha1()' in auth
          assert 'GoogleAuthProvider' in auth
          assert 'notifyIncomingChat' in pathlib.Path('app/src/main/java/it/napolicarte/game/MainActivity.java').read_text()
          print('Identity, chat and release metadata verified')
          PY
      - name: Build release APK without debug signing keys
        run: gradle --no-daemon --stacktrace :app:assembleRelease -x :app:prepareExpansionIndex
      - name: Check release archive
        run: |
          find app/build/outputs/apk/release -type f -maxdepth 1 -name '*.apk' -print
          test "$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -type f | wc -l)" -eq 1
          unzip -t app/build/outputs/apk/release/*.apk | tail -n 2
          sha256sum app/build/outputs/apk/release/*.apk
      - name: Upload release APK for external signing
        uses: actions/upload-artifact@v4
        with:
          name: NAPOLI-CARTE-3D-9-12-UNSIGNED-RELEASE
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
