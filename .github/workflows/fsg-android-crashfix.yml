name: Four Sports Game Android 1.1 Native APK
on:
  push:
    branches: [four-sports-game-crashfix]
    paths-ignore:
      - 'downloads/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform/build tools
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore isolated game sources
        shell: bash
        run: |
          mkdir -p four-sports-game-src
          base64 -d fsg_source.b64 | tar -xJ -C four-sports-game-src
          test -s four-sports-game-src/android/app/src/main/java/com/foursportsgame/arena/MainActivity.java
      - name: Remove Java lambda instructions incompatible with direct D8 invocation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('four-sports-game-src/android/app/src/main/java/com/foursportsgame/arena/MainActivity.java')
          s=p.read_text()
          s=s.replace('view.post(() -> showFailure("Il motore grafico si e\' interrotto. Aggiorna Android System WebView e riapri FOUR SPORTS GAME."));', 'view.post(new Runnable() { @Override public void run() { showFailure("Il motore grafico si e\' interrotto. Aggiorna Android System WebView e riapri FOUR SPORTS GAME."); } });')
          s=s.replace('result -> { if (!"true".equals(result)) finish(); }', 'new android.webkit.ValueCallback<String>() { @Override public void onReceiveValue(String result) { if (!"true".equals(result)) finish(); } }')
          assert '->' not in s
          p.write_text(s)
          PY
      - name: Build and sign APK directly with official Android tools
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$PWD/four-sports-game-src/android/app"
          OUT="$PWD/four-sports-build"
          BT="$ANDROID_HOME/build-tools/35.0.0"
          PLATFORM="$ANDROID_HOME/platforms/android-35/android.jar"
          mkdir -p "$OUT/classes" "$OUT/dex" "$OUT/assets"
          javac -source 8 -target 8 -Xlint:-options -bootclasspath "$PLATFORM" -d "$OUT/classes" "$ROOT/src/main/java/com/foursportsgame/arena/MainActivity.java"
          "$BT/d8" --min-api 21 --lib "$PLATFORM" --output "$OUT/dex" "$OUT"/classes/com/foursportsgame/arena/*.class
          test -s "$OUT/dex/classes.dex"
          sed -i 's#<manifest xmlns:android=#<manifest package="com.foursportsgame.arena" xmlns:android=#' "$ROOT/src/main/AndroidManifest.xml"
          "$BT/aapt2" compile --dir "$ROOT/src/main/res" -o "$OUT/resources.zip"
          "$BT/aapt2" link -o "$OUT/unsigned.apk" -I "$PLATFORM" --manifest "$ROOT/src/main/AndroidManifest.xml" --min-sdk-version 21 --target-sdk-version 28 --version-code 2 --version-name 1.1.0 "$OUT/resources.zip"
          cp "$OUT/dex/classes.dex" "$OUT/"
          cp "$ROOT"/src/main/assets/* "$OUT/assets/"
          (cd "$OUT" && zip -0 -q unsigned.apk classes.dex && zip -0 -q unsigned.apk assets/*)
          "$BT/zipalign" -f 4 "$OUT/unsigned.apk" "$OUT/aligned.apk"
          keytool -genkeypair -alias foursportsgame -keyalg RSA -keysize 2048 -validity 3650 -keystore "$OUT/debug-release.jks" -storepass changeit -keypass changeit -dname "CN=FOUR SPORTS GAME,O=Four Sports Game,C=IT" -noprompt
          "$BT/apksigner" sign --ks "$OUT/debug-release.jks" --ks-key-alias foursportsgame --ks-pass pass:changeit --key-pass pass:changeit --out "$OUT/FOUR_SPORTS_GAME_1_1_ANDROID.apk" "$OUT/aligned.apk"
      - name: Verify APK, signature, manifest and assets
        shell: bash
        run: |
          set -euo pipefail
          APK=four-sports-build/FOUR_SPORTS_GAME_1_1_ANDROID.apk
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -s "$APK"
          unzip -t "$APK" | tail -1
          unzip -l "$APK" | grep 'classes.dex'
          unzip -l "$APK" | grep 'assets/index.html'
          "$BT/apksigner" verify --verbose "$APK"
          "$BT/aapt" dump badging "$APK" | grep -E 'package:|launchable-activity:|sdkVersion:'
      - name: Upload signed APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: FOUR_SPORTS_GAME_1_1_ANDROID_APK
          path: four-sports-build/FOUR_SPORTS_GAME_1_1_ANDROID.apk
          if-no-files-found: error
      - name: Publish APK for direct download
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p downloads
          cp four-sports-build/FOUR_SPORTS_GAME_1_1_ANDROID.apk downloads/FOUR_SPORTS_GAME_1_1_ANDROID.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads/FOUR_SPORTS_GAME_1_1_ANDROID.apk
          git commit -m "Publish installable FOUR SPORTS GAME 1.1 APK"
          git push origin HEAD:four-sports-game-crashfix
