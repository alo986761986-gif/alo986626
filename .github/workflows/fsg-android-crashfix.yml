name: Four Sports Game Android 1.1 Crashfix
on:
  push:
    branches: [four-sports-game-crashfix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Android SDK
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore isolated FOUR SPORTS GAME project
        run: |
          mkdir -p four-sports-game-src
          base64 -d fsg_source.b64 | tar -xJ -C four-sports-game-src
          test -f four-sports-game-src/android/app/src/main/java/com/foursportsgame/arena/MainActivity.java
      - name: Compile real Android APK with D8
        working-directory: four-sports-game-src/android
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify generated package
        run: |
          test -s four-sports-game-src/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t four-sports-game-src/android/app/build/outputs/apk/debug/app-debug.apk | tail -1
      - uses: actions/upload-artifact@v4
        with:
          name: FOUR_SPORTS_GAME_1_1_ANDROID_CRASHFIX_APK
          path: four-sports-game-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
