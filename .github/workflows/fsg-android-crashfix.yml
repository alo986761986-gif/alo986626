name: Four Sports Game Android 1.1 Crashfix
on:
  push:
    branches: [four-sports-game-crashfix]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download standalone Gradle 8.7
        shell: bash
        run: |
          curl --retry 3 -fLsS https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
          /tmp/gradle-8.7/bin/gradle --version
      - name: Install Android SDK platform and build tools
        shell: bash
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path '*/bin/sdkmanager' | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --version
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore isolated FOUR SPORTS GAME project
        shell: bash
        run: |
          mkdir -p four-sports-game-src
          base64 -d fsg_source.b64 | tar -xJ -C four-sports-game-src
          test -s four-sports-game-src/android/app/src/main/java/com/foursportsgame/arena/MainActivity.java
          test -s four-sports-game-src/android/app/src/main/assets/index.html
      - name: Compile Android APK
        working-directory: four-sports-game-src/android
        run: /tmp/gradle-8.7/bin/gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify installable package, signature and entry point
        shell: bash
        run: |
          APK=four-sports-game-src/android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -t "$APK" | tail -1
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -E 'package:|launchable-activity:|sdkVersion:'
      - name: Publish installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FOUR_SPORTS_GAME_v1_1_INSTALLABILE
          path: four-sports-game-src/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
