name: TRISH BOLL Public Multiplayer Server Tests
on:
  push:
    branches: [trish-boll-v4-native-premium]
    paths:
      - 'trish-boll-server/**'
      - '.github/workflows/trish-boll-multiplayer.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  multiplayer-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: trish-boll-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check server syntax
        run: node --check server.js
      - name: Test two real WebSocket clients and server authoritative state
        run: npm test
      - name: Verify no external runtime packages required
        run: |
          node -e 'const p=require("./package.json");if(p.dependencies&&Object.keys(p.dependencies).length)process.exit(1)'
          echo "TRISH_BOLL_PUBLIC_MULTIPLAYER_TEST_OK"
