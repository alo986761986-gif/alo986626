name: TRISH BOLL 5.2 WebSocket Fix Android APK
on:
  push:
    branches: [trish-boll-v5-2-frame-fix]
    paths:
      - 'trish-boll-android/**'
      - '.github/workflows/trish-boll-5-2-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false
      - name: Test WebSocket fragmentation and continuation frames
        working-directory: trish-boll-android
        run: |
          mkdir -p /tmp/trish-ws
          javac -d /tmp/trish-ws app/src/main/java/com/trishboll/arena/WebSocketFrameReader.java tests/WebSocketFrameReaderTest.java
          java -cp /tmp/trish-ws com.trishboll.arena.WebSocketFrameReaderTest
      - name: Test native offline engine and memory bounds
        working-directory: trish-boll-android
        run: |
          mkdir -p /tmp/trish-game
          javac -d /tmp/trish-game app/src/main/java/com/trishboll/arena/GameEngine.java tests/GameEngineSmokeTest.java
          java -cp /tmp/trish-game com.trishboll.arena.GameEngineSmokeTest
      - name: Build official Android APK with WebSocket fix
        working-directory: trish-boll-android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -s trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l trish-boll-android/app/build/outputs/apk/debug/app-debug.apk | grep classes.dex
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TRISH_BOLL_v5_2_WEBSOCKET_FRAME_FIX_ANDROID5_APK
          path: trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
