name: Napoli Carte 3D - Authentic Neapolitan Deck
on:
  push:
    branches: [napoli-carte-3d-build]
    paths:
      - '.github/workflows/napoli-genuine-cards.yml'
      - 'napoli-carte-3d/backend/import_authentic_deck.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install Pillow
      - name: Retrieve original traditional public domain Neapolitan deck
        run: |
          mkdir -p napoli-carte-3d/source
          curl --fail --location --retry 4 --connect-timeout 20 --max-time 180 \
            https://upload.wikimedia.org/wikipedia/commons/c/c4/Carte_napoletane_al_completo.jpg \
            -o napoli-carte-3d/source/napoletane-original.jpg
          echo '86c87ccb01fc9f02cda01157a3cef73fc4ca1342  napoli-carte-3d/source/napoletane-original.jpg' | sha1sum -c -
      - name: Replace simulated playing cards with the real 40-card deck
        run: |
          python napoli-carte-3d/backend/import_authentic_deck.py
          python - <<'PY'
          from pathlib import Path
          p=Path('napoli-carte-3d/android/app/build.gradle')
          s=p.read_text().replace('versionCode 2','versionCode 3').replace("versionName '1.2.0'","versionName '1.3.0'")
          p.write_text(s)
          PY
          cd napoli-carte-3d
          node tests/engine.test.js
          node tests/online.test.js
      - name: Commit the 40 optimized deck pictures, embedded HTML and Android version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add napoli-carte-3d/frontend/index.html \
            napoli-carte-3d/frontend/carte-napoletane/ \
            napoli-carte-3d/android/app/build.gradle
          git diff --cached --quiet || git commit -m "Napoli Carte 3D v1.3 - real public-domain traditional deck"
          git push
