name: Verify social and daily backend endpoints
on:
  push:
    branches: [chiodo-121-server]
    paths:
      - 'chiodo-server/http.js'
      - 'chiodo-server/social70.js'
      - 'chiodo-server/daily71.js'
      - 'chiodo-server/chat77.js'
      - 'chiodo-server/test-chat77.js'
      - 'chiodo-server/test-social-daily-routes.js'
      - '.github/workflows/chiodo-social-daily.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  endpoint-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check chiodo-server/http.js
          node --check chiodo-server/social70.js
          node --check chiodo-server/daily71.js
          node --check chiodo-server/chat77.js
          node --check chiodo-server/test-chat77.js
      - name: Verify private chat and voice security
        run: node chiodo-server/test-chat77.js
      - name: Verify available endpoints and mandatory Firebase authentication
        run: node chiodo-server/test-social-daily-routes.js

      - name: Check production endpoints and database readiness
        env:
          LIVE_BASE: https://napoli-chiodo-121.onrender.com
        run: |
          node <<'NODE'
          const assert=require('node:assert/strict');
          const base=process.env.LIVE_BASE;
          async function probe(path,{method='GET',body}={}){
            let lastError;
            for(let attempt=0;attempt<3;attempt++){
              try{
                const response=await fetch(base+path,{
                  method,
                  headers:body?{'Content-Type':'application/json'}:{},
                  body:body&&JSON.stringify(body),
                  signal:AbortSignal.timeout(30000)
                });
                const text=await response.text();
                let data;try{data=JSON.parse(text)}catch(e){throw Error(path+' did not return JSON: '+text.slice(0,120))}
                return {status:response.status,data};
              }catch(e){lastError=e;if(attempt<2)await new Promise(resolve=>setTimeout(resolve,2500));}
            }
            throw Error(path+' unreachable: '+String(lastError));
          }
          (async()=>{
            const health=await probe('/health');
            assert.equal(health.status,200,'The game server is not healthy: '+JSON.stringify(health));
            assert.equal(health.data.ok,true);
            for(const path of ['/social/me','/social/friends','/social/stats','/social/progress','/social/search?q=test','/daily/status']){
              const r=await probe(path);
              assert.equal(r.status,401,path+' must require Firebase authentication, not a missing endpoint: '+JSON.stringify(r));
              assert.match(String(r.data.error),/Accedi con email o Google/i);
              console.log('OK '+path+' - authenticated endpoint exists');
            }
            const claim=await probe('/daily/claim',{method:'POST',body:{}});
            assert.equal(claim.status,401,'Daily claims must require authentication: '+JSON.stringify(claim));
            const database=await probe('/admob/health');
            assert.equal(database.status,200,'Server database/identity health is not ready: '+JSON.stringify(database));
            assert.equal(database.data.database,true);
            assert.equal(database.data.ready,true);
            assert.equal(database.data.identityConfigured,true);
            console.log('PASS: production routes, database connectivity and Firebase configuration are ready');
          })().catch(e=>{console.error(e);process.exitCode=1;});
          NODE
