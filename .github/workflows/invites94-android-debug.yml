name: NAPOLI CARTE 3D Invite Feature Android Debug APK
on:
  workflow_dispatch:
  push:
    branches: [feature/inviti-partite-live-94]
    paths:
      - 'app/src/main/**'
      - 'app/build.gradle'
      - 'chiodo-server/games/expansion-session.js'
      - 'server/test-invites94.js'
      - '.github/workflows/invites94-android-debug.yml'
permissions:
  contents: read
jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install Android SDK 36 and Build Tools 35.0.0
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Validate invitation and existing game rules
        shell: bash
        run: |
          set -euo pipefail
          node --test server/test-invites94.js server/test-expansion-session.js
      - name: Assemble Android debug APK
        run: gradle :app:assembleDebug --no-daemon --console=plain --stacktrace
      - name: Verify APK signature and assets
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          python3 - <<'PY'
          from zipfile import ZipFile
          name='app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(name) as a:
              files=set(a.namelist())
              for required in ('assets/social70.js','assets/expansion-ui.js','assets/expansion-session.js','assets/push82.js','assets/index.html'):
                  assert required in files, required
              assert b'Inviti e partite LIVE' in a.read('assets/social70.js')
              assert b'invitationContext' in a.read('assets/expansion-ui.js')
              assert b'game_invites' in a.read('assets/push82.js')
          PY
          cp "$apk" NAPOLI_CARTE_3D_INVITI_94_DEBUG.apk
          sha256sum NAPOLI_CARTE_3D_INVITI_94_DEBUG.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NAPOLI_CARTE_3D_INVITI_DEBUG_TEST
          path: |
            NAPOLI_CARTE_3D_INVITI_94_DEBUG.apk
            SHA256SUMS.txt
          retention-days: 14
          if-no-files-found: error
