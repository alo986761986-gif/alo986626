name: TRISH BOLL Public WSS Two Player Test
on:
  push:
    branches: [trish-boll-v4-native-premium]
    paths:
      - 'trish-boll-server/test_public.js'
      - '.github/workflows/trish-boll-public-e2e.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-wss-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify real global WSS arena with two player sessions
        run: node trish-boll-server/test_public.js
