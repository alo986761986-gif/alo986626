name: TRISH BOLL 5.1 Global Auto Server APK
on:
  push:
    branches: [trish-boll-v4-native-premium]
    paths:
      - '.github/workflows/trish-boll-global-apk.yml'
      - 'trish-boll-android/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-global-android:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false
      - name: Test native game logic for four modes
        working-directory: trish-boll-android
        run: |
          mkdir -p /tmp/trishlogic
          javac -d /tmp/trishlogic app/src/main/java/com/trishboll/arena/GameEngine.java tests/GameEngineSmokeTest.java
          java -cp /tmp/trishlogic com.trishboll.arena.GameEngineSmokeTest
      - name: Build Android 5 compatible APK using official SDK
        working-directory: trish-boll-android
        run: gradle --no-daemon :app:assembleDebug
      - name: Validate APK exists and native resources
        working-directory: trish-boll-android
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep classes.dex
      - uses: actions/upload-artifact@v4
        with:
          name: TRISH_BOLL_5_1_GLOBAL_AUTO_SERVER_ANDROID5_APK
          path: trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
