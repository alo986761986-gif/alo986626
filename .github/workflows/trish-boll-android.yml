name: TRISH BOLL Android build and launch test
on:
  push:
    branches: [trish-boll-v4-native-premium]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: trish-boll-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false
      - name: Test game simulation, AI and bounded memory
        run: |
          mkdir -p /tmp/trish-engine-test
          javac -d /tmp/trish-engine-test app/src/main/java/com/trishboll/arena/GameEngine.java tests/GameEngineSmokeTest.java
          java -cp /tmp/trish-engine-test com.trishboll.arena.GameEngineSmokeTest
      - name: Compile Android with preinstalled SDK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK is present
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TRISH_BOLL_v4_NATIVE_PREMIUM_APK
          path: trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload source project
        uses: actions/upload-artifact@v4
        with:
          name: TRISH_BOLL_v4_NATIVE_PROJECT
          path: trish-boll-android/
          if-no-files-found: error
  launch-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        working-directory: trish-boll-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false
      - name: Compile app for emulator
        run: gradle --no-daemon :app:assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: trish-boll-android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.trishboll.arena/.MainActivity
            sleep 12
            adb shell pidof com.trishboll.arena > /tmp/pid.txt
            test -s /tmp/pid.txt
            echo "ANDROID_LAUNCH_PASS pid=$(cat /tmp/pid.txt)"
            adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|TrishBollAndroid|com.trishboll.arena' | tail -100 || true
