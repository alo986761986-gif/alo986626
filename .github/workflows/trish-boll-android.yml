name: TRISH BOLL Android build and launch test
on:
  push:
    branches:
      - trish-boll-android-native-fix
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: trish-boll-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build genuine Android APK
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify output
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging app/build/outputs/apk/debug/app-debug.apk | head -25
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TRISH_BOLL_v3.0_ANDROID5_DEBUG_APK
          path: trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  launch-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    defaults:
      run:
        working-directory: trish-boll-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build app for device test
        run: gradle --no-daemon :app:assembleDebug
      - name: Boot Android emulator and run startup smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 23
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: trish-boll-android
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.trishboll.arena/.MainActivity
            sleep 10
            adb shell pidof com.trishboll.arena > /tmp/trish-pid.txt
            test -s /tmp/trish-pid.txt
            echo "ANDROID_LAUNCH_PASS pid=$(cat /tmp/trish-pid.txt)"
            adb logcat -d -v brief | grep -E 'FATAL EXCEPTION|TrishBollAndroid|com.trishboll.arena' | tail -100 || true
      - name: Upload logs
        if: always()
        run: adb logcat -d -v time > emulator-launch-log.txt || true
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TRISH_BOLL_ANDROID_LAUNCH_LOGS
          path: trish-boll-android/emulator-launch-log.txt
          if-no-files-found: ignore
