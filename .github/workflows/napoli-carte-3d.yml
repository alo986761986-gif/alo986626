name: Napoli Carte 3D - Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, napoli-carte-3d-build]
    paths:
      - 'napoli-carte-3d/**'
      - '.github/workflows/napoli-carte-3d.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false
      - name: Run rules engine tests
        working-directory: napoli-carte-3d
        run: node tests/engine.test.js
      - name: Run online matchmaking engine tests
        working-directory: napoli-carte-3d
        run: node tests/online.test.js
      - name: Generate embedded Android game with public server address
        working-directory: napoli-carte-3d
        run: python3 backend/build_android_assets.py
      - name: Build Android APK
        working-directory: napoli-carte-3d/android
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Napoli-Carte-3D-Android-debug
          path: napoli-carte-3d/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
