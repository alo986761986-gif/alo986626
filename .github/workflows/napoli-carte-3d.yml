name: Napoli Carte 3D - Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, napoli-carte-3d-build, napoli-carte-3d-v3-premium]
    paths:
      - 'napoli-carte-3d/**'
      - '.github/workflows/napoli-carte-3d.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false
      - name: Run rules engine tests
        working-directory: napoli-carte-3d
        run: node tests/engine.test.js
      - name: Run online matchmaking engine tests
        working-directory: napoli-carte-3d
        run: node tests/online.test.js
      - name: Validate all 40 authentic Neapolitan cards
        working-directory: napoli-carte-3d
        run: node tests/cards.test.js
      - name: Validate profile avatars, photo privacy and online friendships
        working-directory: napoli-carte-3d
        run: node tests/profile.test.js
      - name: Test live chat and WebRTC room privacy in six games
        working-directory: napoli-carte-3d
        run: node tests/realtime.test.js
      - name: Validate non-overlapping controls and microphone compatibility
        working-directory: napoli-carte-3d
        run: node tests/ui-audio24.test.js
      - name: Verify legal multi-card capture choices
        working-directory: napoli-carte-3d
        run: node tests/capture27.test.js
      - name: Validate server stability and reconnect safety
        working-directory: napoli-carte-3d
        run: |
          node --check backend/local-server.js
          node --check backend/audio-relay.js
          node tests/stability.test.js
          node tests/stability-http.test.js
      - name: Verify premium graphics and persistence recovery
        working-directory: napoli-carte-3d
        run: |
          node --check frontend/premium30.js
          node --check backend/persistence.js
          node tests/persistence30.test.js
          node tests/stability.test.js
          node tests/stability-http.test.js
      - name: Generate embedded Android game with public server address
        working-directory: napoli-carte-3d
        run: python3 backend/build_android_assets.py
      - name: Build Android APK
        working-directory: napoli-carte-3d/android
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Napoli-Carte-3D-Android-debug
          path: napoli-carte-3d/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
