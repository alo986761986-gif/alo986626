name: TRISH BOLL 5.4 Games Studios Intro APK
on:
  push:
    branches: [trish-boll-v5-4-games-studios-intro]
    paths:
      - 'trish-boll-android/**'
      - '.github/workflows/trish-boll-5-4-intro.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false
      - name: Verify genuine Games Studios logo is embedded
        run: |
          test -s trish-boll-android/app/src/main/assets/games_studios_logo.png
          file trish-boll-android/app/src/main/assets/games_studios_logo.png
      - name: Verify previous WebSocket fix
        working-directory: trish-boll-android
        run: |
          mkdir -p /tmp/trish-ws
          javac -d /tmp/trish-ws app/src/main/java/com/trishboll/arena/WebSocketFrameReader.java tests/WebSocketFrameReaderTest.java
          java -cp /tmp/trish-ws com.trishboll.arena.WebSocketFrameReaderTest
      - name: Verify native game engine
        working-directory: trish-boll-android
        run: |
          mkdir -p /tmp/trish-game
          javac -d /tmp/trish-game app/src/main/java/com/trishboll/arena/GameEngine.java tests/GameEngineSmokeTest.java
          java -cp /tmp/trish-game com.trishboll.arena.GameEngineSmokeTest
      - name: Compile Android APK with animated intro
        working-directory: trish-boll-android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Inspect build
        run: |
          test -s trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l trish-boll-android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.dex|games_studios_logo.png'
      - uses: actions/upload-artifact@v4
        with:
          name: TRISH_BOLL_5_4_GAMES_STUDIOS_BOOTANIMATION_APK
          path: trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
