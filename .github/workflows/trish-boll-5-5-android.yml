name: TRISH BOLL 5.5 Controls Skins Online APK
on:
  push:
    branches: [trish-boll-v5-5-controls-skins-online-qa]
    paths:
      - 'trish-boll-android/**'
      - '.github/workflows/trish-boll-5-5-android.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false
      - name: Verify WebSocket frame reassembly
        working-directory: trish-boll-android
        run: |
          mkdir -p /tmp/ws
          javac -d /tmp/ws app/src/main/java/com/trishboll/arena/WebSocketFrameReader.java tests/WebSocketFrameReaderTest.java
          java -cp /tmp/ws com.trishboll.arena.WebSocketFrameReaderTest
      - name: Verify AI and offline modes
        working-directory: trish-boll-android
        run: |
          mkdir -p /tmp/game
          javac -d /tmp/game app/src/main/java/com/trishboll/arena/GameEngine.java tests/GameEngineSmokeTest.java
          java -cp /tmp/game com.trishboll.arena.GameEngineSmokeTest
      - name: Build original native Android APK
        working-directory: trish-boll-android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Check original logo and compiled dex
        run: |
          test -s trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l trish-boll-android/app/build/outputs/apk/debug/app-debug.apk | grep -E 'classes.dex|games_studios_logo.png'
      - uses: actions/upload-artifact@v4
        with:
          name: TRISH_BOLL_5_5_FOOD_DPAD_SKINS_ANDROID5_APK
          path: trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
