name: Build TRISH BOLL Android
on:
  push:
    branches: [trish-boll-android-native-fix]
  workflow_dispatch:
jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: trish-boll-android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: TRISH_BOLL_v3_ANDROID5_APK
          path: trish-boll-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
