plugins { id 'com.android.application' }
android {
    namespace 'com.trishboll.arena'
    compileSdk 35
    defaultConfig {
        applicationId 'com.trishboll.arena'
        minSdk 21
        targetSdk 28
        versionCode 10
        versionName '5.4-games-studios-intro'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
}
